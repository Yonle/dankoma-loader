<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#00aeec">

    <title>DankomaP</title>

    <meta name="description" content="Dankoma.js Web Loader: load and play Bilibili-style danmaku with HTML Canvas.">
    
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/nmmenu.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/web_samples.css">
</head>
<body>
<div id="loaderOverlay" class="loaderOverlay" hidden>
    <div class="loader">
        <h2>Load video</h2>

        <label class="drop-zone" for="videoFile">
            <strong>Video</strong>
            <span>
                Click or drag a video file here
            </span>

            <input
                id="videoFile"
                type="file"
                accept="video/*"
            >
        </label>

        <label class="drop-zone" for="danmakuFile">
            <strong>Dankoma JSONL segments</strong>
            <span>
                Click or drag JSONL segment files here
            </span>

            <input
                id="danmakuFile"
                type="file"
                multiple
                accept="
                    .jsonl,
                    .json,
                    .gz,
                    text/plain,
                    application/json,
                    application/gzip
                "
            >
        </label>

        <div id="samples" hidden>
            <h3>Samples</h3>

            <div id="sampleList"></div>
        </div>

        <div class="loader-actions">
            <button
                id="loadButton"
                type="button"
                class="buttonh"
            >
                Load
            </button>

            <button
                id="cancelButton"
                type="button"
            >
                Cancel
            </button>
        </div>

        <div id="loaderStatus"></div>
    </div>
</div>

<div id="nwMenuBar">
    <div class="menu">
        <button class="menu-button" type="button">
            File
        </button>

        <div class="menu-popup">
            <button
                class="menu-item"
                type="button"
                data-action="load"
            >
                Load...
            </button>
        </div>
    </div>

    <div class="menu">
        <button class="menu-button" type="button">
            Help
        </button>

        <div class="menu-popup">
            <button
                class="menu-item"
                type="button"
                data-action="about"
            >
                About
            </button>
        </div>
    </div>
</div>

<div id="player">
    <video></video>
    <canvas id="danmaku"></canvas>

    <div id="controls">
        <button id="playPause" type="button">▶</button>
        <button id="canvasToggle" type="button">DM</button>

        <input
            id="seekbar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.01"
        >

        <span id="duration">0:00 / 0:00</span>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            value="1"
            step="0.01"
        >

        <button id="settings" type="button">⚙</button>
        <button id="fullscreen" type="button">⛶</button>

        <div id="settingsPopup" class="settings-popup" hidden>
            <div class="settings-header">
                <span>Settings</span>
                <button id="settingsClose" type="button">×</button>
            </div>

            <div id="settingsList" class="settings-list"></div>
        </div>
    </div>
</div>

<script src="js_ui/bootstrap.js" type="module"></script>
</body>
</html>
